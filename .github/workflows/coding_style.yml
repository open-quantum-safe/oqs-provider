name: Coding style tests
on: [workflow_call]

permissions:
  contents: read

# TEMPORARY-LIBOQS-PEG (oqs-provider#875): the NIST round-3 signature FAEST is only available on
# liboqs branch na_FAEST_liboqs. Set LIBOQS_BRANCH back to "main" as soon as FAEST lands in liboqs
# main (grep for TEMPORARY-LIBOQS-PEG to find every place); generate.yml needs no change then.
env:
  LIBOQS_BRANCH: "na_FAEST_liboqs"

jobs:
  check_clang_format:
    name: "Coding style"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: openquantumsafe/ci-ubuntu-latest@sha256:52c9f9c763619c6495b34948c03b613ef1300deba8e615a26ea603d5ab0cfc47
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y clang-format

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check coding style using clang-format
        run: ./scripts/do_code_format.sh

      - name: Verify nothing changes on re-generate code
        run: |
          git config --global user.name "ciuser" && \
          git clone --branch "$LIBOQS_BRANCH" https://github.com/open-quantum-safe/liboqs.git && \
          git config --global user.email "ci@openquantumsafe.org" && \
          git config --global --add safe.directory `pwd` && \
          export LIBOQS_SRC_DIR=`pwd`/liboqs && \
          ! pip3 install -r oqs-template/requirements.txt 2>&1 | grep ERROR && \
          python3 oqs-template/generate.py && \
          ./scripts/do_code_format.sh --no-dry-run && \
          git diff && \
          ! git status | grep modified
