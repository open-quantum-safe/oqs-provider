name: Linux tests

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  coding_style_tests:
    uses: ./.github/workflows/coding_style.yml
  linux_baseline:
    runs-on: ubuntu-latest
    needs: [coding_style_tests]
    strategy:
      fail-fast: false
      matrix:
        cmake-params: [ "" ]
        libjade-build: ["ON", "OFF"]
    container:
      image: openquantumsafe/ci-ubuntu-jammy@sha256:a4195181536916bb79e0e309b57fd5d9df20a3eee8f500da6caae9e355ba8807
    env:
      MAKE_PARAMS: "-j 18"
      LIBOQS_BRANCH: "main"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Full build
        run: OQSPROV_CMAKE_PARAMS=${{ matrix.cmake-params}} OQS_LIBJADE_BUILD=${{ matrix.libjade-build }} ./scripts/fullbuild.sh
      - name: Test
        run: ./scripts/runtests.sh -V

  linux_intel:
    runs-on: ubuntu-latest
    needs: [coding_style_tests]
    strategy:
      fail-fast: false
      matrix:
        ossl-branch: [openssl-3.4.1, openssl-3.5.0, openssl-4.0.1, master] # retain openssl-3.4.1 to test non-OpenSSL PQ alg implementations
        # OQS_KEM_ENCODERS=ON is weekly-only (see weekly_tests.yml); rarely used on the PR path.
        cmake-params: [ "" ]
        libjade-build:
          - "ON"
          - "OFF"
    # Ubuntu -latest (not jammy/EOL OpenSSL 3.0). Alpine/focal matrix includes were
    # previously listed here but did not expand into jobs; left out rather than
    # invent a new alpine matrix in this PR. ASan image bump is owned by #863.
    container:
      image: openquantumsafe/ci-ubuntu-latest@sha256:52c9f9c763619c6495b34948c03b613ef1300deba8e615a26ea603d5ab0cfc47
    env:
      MAKE_PARAMS: "-j 18"
      LIBOQS_BRANCH: "main"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Add safe directory exception
        run: git config --global --add safe.directory /__w/oqs-provider/oqs-provider
      - name: Resolve upstream commits for cache keys
        id: refs
        if: matrix.ossl-branch != ''
        run: |
          echo "ossl=$(git ls-remote https://github.com/openssl/openssl.git ${{ matrix.ossl-branch }} | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "liboqs=$(git ls-remote https://github.com/open-quantum-safe/liboqs.git main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Retrieve OpenSSL from cache
        id: cache-openssl
        if: matrix.ossl-branch != ''
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .localossl
          key: ${{ runner.os }}-openssl-${{ matrix.ossl-branch }}-${{ steps.refs.outputs.ossl }}
      - name: Build OpenSSL from source if not cached
        if: matrix.ossl-branch != '' && steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          OSSL_PREFIX="$GITHUB_WORKSPACE/.localossl"
          git clone --depth 1 --branch "${{ matrix.ossl-branch }}" https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          LDFLAGS="-Wl,-rpath -Wl,${OSSL_PREFIX}/lib64" ./config --prefix="${OSSL_PREFIX}"
          make ${MAKE_PARAMS}
          make install_sw install_ssldirs
          cd ..
          if [ -d "${OSSL_PREFIX}/lib64" ] && [ ! -e "${OSSL_PREFIX}/lib" ]; then ln -s lib64 "${OSSL_PREFIX}/lib"; fi
          rm -rf openssl-src
      - name: Check out liboqs source (needed by the re-generation step)
        if: matrix.ossl-branch != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          set-safe-directory: true
          repository: open-quantum-safe/liboqs
          ref: ${{ steps.refs.outputs.liboqs }}
          path: liboqs
      - name: Retrieve liboqs build from cache
        id: cache-liboqs
        if: matrix.ossl-branch != ''
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .local
          key: ${{ runner.os }}-liboqs-${{ steps.refs.outputs.liboqs }}-${{ matrix.ossl-branch }}-libjade${{ matrix.libjade-build }}
      - name: Expose the cached OpenSSL to build and tests
        if: matrix.ossl-branch != ''
        run: |
          echo "OSSL_INSTALL_ARG=$GITHUB_WORKSPACE/.localossl"         >> "$GITHUB_ENV"
          echo "OPENSSL_APP=$GITHUB_WORKSPACE/.localossl/bin/openssl"  >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.localossl/lib64"    >> "$GITHUB_ENV"
      - name: Full build
        run: OPENSSL_INSTALL=$OSSL_INSTALL_ARG OQSPROV_CMAKE_PARAMS=${{ matrix.cmake-params}} OPENSSL_BRANCH=${{ matrix.ossl-branch }} OQS_LIBJADE_BUILD=${{ matrix.libjade-build }} ./scripts/fullbuild.sh
      - name: Test
        run: ./scripts/runtests.sh -V
      - name: Re-generate code
        run: |
          apt-get update && apt-get install -y clang-format && \
          git config --global user.name "ciuser" && \
          git config --global user.email "ci@openquantumsafe.org" && \
          git config --global --add safe.directory `pwd` && \
          export LIBOQS_SRC_DIR=`pwd`/liboqs && \
          ! pip3 install -r oqs-template/requirements.txt 2>&1 | grep ERROR && \
          python3 oqs-template/generate.py
      - name: Full re-build & test
        run: rm -rf _build && OPENSSL_INSTALL=$OSSL_INSTALL_ARG OPENSSL_BRANCH=${{ matrix.ossl-branch }} OQS_LIBJADE_BUILD=${{ matrix.libjade-build }} ./scripts/fullbuild.sh && ./scripts/runtests.sh
      - name: Build .deb install package
        run: cpack -C DebPack
        working-directory: _build
      - name: Retain .deb installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.ossl-branch }} ${{ matrix.cmake-params }} ${{ matrix.libjade-build }} oqsprovider-x64
          path: _build/*.deb

  # Static oqsprovider build: run the C test suite linked against liboqsprovider.a
  # (openssl CLI / runtests.sh interop needs a shared module and is covered elsewhere).
  # See #590 / prior attempt #367.
  linux_static:
    name: "static build + ctest"
    runs-on: ubuntu-latest
    needs: [coding_style_tests]
    container:
      image: openquantumsafe/ci-ubuntu-latest@sha256:52c9f9c763619c6495b34948c03b613ef1300deba8e615a26ea603d5ab0cfc47
    env:
      MAKE_PARAMS: "-j 18"
      LIBOQS_BRANCH: "main"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve liboqs commit for cache key
        id: refs
        run: echo "liboqs=$(git ls-remote https://github.com/open-quantum-safe/liboqs.git main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Retrieve liboqs build from cache
        id: cache-liboqs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .local
          key: ${{ runner.os }}-liboqs-${{ steps.refs.outputs.liboqs }}-static-ctest
      - name: Full static build
        run: OQSPROV_CMAKE_PARAMS="-DOQS_PROVIDER_BUILD_STATIC=ON" ./scripts/fullbuild.sh
      - name: Run ctest (static-linked binaries)
        run: ctest --test-dir _build --output-on-failure --extra-verbose
      - name: Verify static library install path
        run: |
          mkdir -p _sysroot/
          cmake --install _build --prefix _sysroot/
          stat _sysroot/lib/liboqsprovider.a

  asan_linux_intel:
    name: "Security checks"
    runs-on: ubuntu-latest
    needs: [coding_style_tests]
    strategy:
      fail-fast: false
    # Needs clang >= 18: older ASan runtimes randomly segfault at startup on
    # runner kernels using 32 bits of mmap ASLR entropy (vm.mmap_rnd_bits).
    container:
      image: openquantumsafe/ci-ubuntu-latest@sha256:52c9f9c763619c6495b34948c03b613ef1300deba8e615a26ea603d5ab0cfc47
    env:
      CC: "clang"
      CXX: "clang++"
      ASAN_C_FLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      ASAN_OPTIONS: "external_symbolizer_path=/usr/bin/addr2line:detect_stack_use_after_return=1:detect_leaks=1"
      OPENSSL_BRANCH: "openssl-3.5.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check clang version
        run: |
          clang --version
          major=$(clang -dumpversion | cut -d. -f1)
          if [ "${major}" -lt 18 ]; then
            echo "clang ${major} found; ASan needs clang >= 18 on current runners"
            exit 1
          fi

      - name: Clone and build OpenSSL(3) with ASan
        run: |
          git clone --depth=1 --branch "${OPENSSL_BRANCH}" https://github.com/openssl/openssl.git openssl
          cd openssl
          mkdir install
          ./Configure --openssldir="${PWD}/install" \
                      --prefix="${PWD}/install" \
                      --debug \
                      enable-asan \
                      no-tests
          make -j$(nproc)
          make install_sw
          cd ..

      - name: Clone and build liboqs with ASan
        run: |
          git clone --depth=1 --branch main https://github.com/open-quantum-safe/liboqs.git liboqs
          cd liboqs
          mkdir build install
          cmake -GNinja -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DOQS_USE_OPENSSL=OFF \
                -DCMAKE_C_FLAGS="${ASAN_C_FLAGS}" \
                -DCMAKE_EXE_LINKER_FLAGS="${ASAN_C_FLAGS}" \
                -DCMAKE_INSTALL_PREFIX="${PWD}/install"
          cmake --build build -j$(nproc)
          cmake --install build
          cd ..

      - name: Build oqs-provider with ASan
        run: |
          cmake -GNinja -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DOPENSSL_ROOT_DIR="$PWD/openssl/install" \
                -Dliboqs_DIR="$PWD/liboqs/install/lib/cmake/liboqs" \
                -DCMAKE_C_FLAGS="${ASAN_C_FLAGS}" \
                -DCMAKE_EXE_LINKER_FLAGS="${ASAN_C_FLAGS}"
          cmake --build build -j$(nproc)

      - name: Verify that test binaries are linked against ASan
        run: |
          find build/test/ -type f -perm '/u=x' | while read -r test_bin; do
            # __asan_init is defined by every ASan runtime; clang >= 21 no
            # longer emits the __local_asan_preinit symbol.
            if ! nm "${test_bin}" | grep -q -w '__asan_init'; then
              echo "ASan not found in ${test_bin}"
              exit 1
            fi
          done

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --extra-verbose

  linux_aarch64:
    name: "aarch64 cross-compilation"
    runs-on: ubuntu-latest
    needs: [coding_style_tests]
    strategy:
      fail-fast: false
    container:
      image: openquantumsafe/ci-ubuntu-jammy@sha256:a4195181536916bb79e0e309b57fd5d9df20a3eee8f500da6caae9e355ba8807
    env:
      OPENSSL_BRANCH: "openssl-4.0.1"
      INSTALL_DIR: "/opt/install"
      CMAKE_TOOLCHAIN_FILE: "/opt/linux-aarch64-toolchain.cmake"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: apt-get update && apt-get install -y ninja-build git cmake nodejs gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Prepare install directory
        run: mkdir -p "${INSTALL_DIR}"

      - name: Clone and build OpenSSL(4) for linux-aarch64
        working-directory: /opt/
        run: |
          git clone --depth=1 --branch "${OPENSSL_BRANCH}" https://github.com/openssl/openssl.git openssl
          cd openssl
          ./Configure linux-aarch64 no-tests --prefix="${INSTALL_DIR}" \
                                    --openssldir="${INSTALL_DIR}" \
                                    --cross-compile-prefix=aarch64-linux-gnu- \
                                    --release
          make -j$(nproc)
          make install_sw

      - name: Write CMake toolchain file for liboqs and oqs-provider
        run: |
          echo "set(CMAKE_SYSTEM_NAME Linux) \n
                set(CMAKE_SYSTEM_PROCESSOR aarch64) \n
                set(CMAKE_C_COMPILER "/usr/bin/aarch64-linux-gnu-gcc")\n" > "${CMAKE_TOOLCHAIN_FILE}"

      - name: Clone and build liboqs for linux-aarch64
        working-directory: /opt/
        run: |
          git clone --depth=1 --branch main https://github.com/open-quantum-safe/liboqs.git liboqs
          cd liboqs
          mkdir build install
          cmake --toolchain "${CMAKE_TOOLCHAIN_FILE}" \
                -GNinja -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                -DOQS_USE_OPENSSL=OFF
          cmake --build build -j$(nproc)
          cmake --install build

      - name: Build oqs-provider for linux-aarch64
        run: |
          cmake --toolchain "${CMAKE_TOOLCHAIN_FILE}" \
                -GNinja -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                -DOPENSSL_ROOT_DIR="${INSTALL_DIR}" \
                -Dliboqs_DIR="${INSTALL_DIR}/lib/cmake/liboqs"
          cmake --build build -j$(nproc)
          cmake --install build

      - name: Run tests with qemu-aarch64
        run: |
            cmake -B build -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64;-L;/usr/aarch64-linux-gnu"
            ctest --test-dir build/

      - name: Build .deb install package
        run: |
            cpack \
                --toolchain "${CMAKE_TOOLCHAIN_FILE}" \
                -C DebPack \
                -DCMAKE_INSTALL_PREFIX=/usr
        working-directory: build

      - name: Verify the .deb file target architecture.
        working-directory: build
        run: |
            dpkg -I oqs-provider-*.deb | grep -q "Architecture: arm64"

      - name: Retain .deb installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oqsprovider-aarch64
          path: build/*.deb
