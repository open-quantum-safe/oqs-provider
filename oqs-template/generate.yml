# NIST OIDs see https://csrc.nist.gov/projects/computer-security-objects-register/algorithm-registration
# Signature prefix 2.16.840.1.101.3.4.3.
# ML-DSA code points: https://datatracker.ietf.org/doc/draft-tls-westerbaan-mldsa/00
  -
    family: 'ML-DSA'
    variants:
      -
        name: 'mldsa44'
        pretty_name: 'ML-DSA-44'
        oqs_meth: 'OQS_SIG_alg_ml_dsa_44'
        oid: '2.16.840.1.101.3.4.3.17'
        code_point: '0x0904'
        enable: true
        enable_tls: true
        openssl_version: 3.5.0
        mix_with: [{'name': 'p256',
                    'pretty_name': 'ECDSA p256',
                    'oid': '1.3.9999.7.5',
                    'code_point': '0xff06'},
                   {'name': 'rsa3072',
                    'pretty_name': 'RSA3072',
                    'oid': '1.3.9999.7.6',
                    'code_point': '0xff07'}]
      -
        name: 'mldsa65'
        pretty_name: 'ML-DSA-65'
        oqs_meth: 'OQS_SIG_alg_ml_dsa_65'
        oid: '2.16.840.1.101.3.4.3.18'
        code_point: '0x0905'
        enable: true
        enable_tls: true
        openssl_version: 3.5.0
        mix_with: [{'name': 'p384',
